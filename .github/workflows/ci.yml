name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Other workspaces import @amp-csr/shared's build output.
      - run: npm run build -w @amp-csr/shared

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # Drives the real portal in Chromium against an in-browser fake of the API, so it needs no database.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # `pretest:e2e` builds @amp-csr/shared first.
      - run: npm run test:e2e -w @amp-csr/web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # The one check to require in master's branch protection: it fails unless every job above
  # passed, and a job added above only counts once it's listed in `needs`. `always()` keeps it
  # from being skipped, since GitHub treats a skipped required check as passing.
  ci-passed:
    if: always()
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test: ${{ needs.test.result }}, e2e: ${{ needs.e2e.result }}"
          [ "${{ needs.test.result }}" = success ] && [ "${{ needs.e2e.result }}" = success ]
