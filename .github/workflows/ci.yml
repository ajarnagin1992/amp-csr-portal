name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Other workspaces import @amp-csr/shared's build output.
      - run: npm run build -w @amp-csr/shared

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
