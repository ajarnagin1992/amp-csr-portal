name: Deploy API

# Builds the NestJS API, runs Prisma migrations against Neon, and deploys to
# an Azure Web App. Runs only after CI has passed on master, and only when
# the API, shared package, or dependencies changed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ github.event_name == 'workflow_dispatch' || steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - id: diff
        if: github.event_name == 'workflow_run'
        run: |
          echo "relevant=$(git diff --name-only HEAD~1 HEAD | grep -qE '^(apps/api/|packages/shared/|package(-lock)?\.json)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build -w @amp-csr/shared
      - run: npm run build -w @amp-csr/api

      - name: Run database migrations
        working-directory: apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Stage deployment package
        run: |
          mkdir -p deploy/apps/api deploy/packages/shared
          cp -r apps/api/dist apps/api/package.json apps/api/prisma deploy/apps/api/
          cp -r packages/shared/dist packages/shared/package.json deploy/packages/shared/
          cp package.json package-lock.json deploy/
          cp -r node_modules deploy/node_modules

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy
          startup-command: node apps/api/dist/main.js
